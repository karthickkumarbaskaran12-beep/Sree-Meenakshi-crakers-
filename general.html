     FIREWORKS JAVASCRIPT
     ======================================================= -->

<script>

(() => {

    const canvas =
        document.getElementById("fireworks");

    const ctx =
        canvas.getContext("2d");


    let width = 0;
    let height = 0;

    let dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    let rockets = [];
    let particles = [];

    let lastLaunch = 0;


    /* =====================================================
       RANDOM NUMBER
       ===================================================== */

    const random = (min, max) =>
        Math.random() * (max - min) + min;


    /* =====================================================
       RESIZE CANVAS
       ===================================================== */

    function resize() {

        dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );

        width =
            window.innerWidth;

        height =
            window.innerHeight;


        canvas.width =
            Math.floor(width * dpr);

        canvas.height =
            Math.floor(height * dpr);


        canvas.style.width =
            width + "px";

        canvas.style.height =
            height + "px";


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

    }


    /* =====================================================
       LAUNCH ROCKET
       ===================================================== */

    function launch() {

        rockets.push({

            x:
                random(
                    width * .12,
                    width * .88
                ),

            y:
                height + 10,

            targetY:
                random(
                    height * .14,
                    height * .50
                ),

            speed:
                random(
                    6.5,
                    9.5
                ),

            hue:
                random(
                    35,
                    55
                )

        });

    }


    /* =====================================================
       EXPLODE FIREWORK
       ===================================================== */

    function explode(rocket) {

        const count =
            Math.floor(
                random(
                    38,
                    58
                )
            );


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI *
                2;


            const speed =
                random(
                    1.2,
                    5.2
                );


            particles.push({

                x:
                    rocket.x,

                y:
                    rocket.y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                life: 1,

                size:
                    random(
                        1,
                        2.2
                    ),

                hue:
                    rocket.hue

            });

        }

    }


    /* =====================================================
       DRAW ANIMATION
       ===================================================== */

    function draw(timestamp) {


        /* Background Trail */

        ctx.fillStyle =
            "rgba(10, 0, 0, 0.18)";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        /* Launch New Rocket */

        if (
            timestamp - lastLaunch >
            random(900, 1500)
        ) {

            launch();

            lastLaunch =
                timestamp;

        }


        /* =================================================
           ROCKETS
           ================================================= */

        for (
            let i = rockets.length - 1;
            i >= 0;
            i--
        ) {

            const r =
                rockets[i];


            r.y -= r.speed;


            ctx.beginPath();

            ctx.arc(
                r.x,
                r.y,
                1.6,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "rgba(255, 215, 100, .9)";

            ctx.fill();


            /* Explode */

            if (
                r.y <= r.targetY
            ) {

                explode(r);

                rockets.splice(
                    i,
                    1
                );

            }

        }


        /* =================================================
           PARTICLES
           ================================================= */

        for (
            let i = particles.length - 1;
            i >= 0;
            i--
        ) {

            const p =
                particles[i];


            p.x += p.vx;
            p.y += p.vy;


            /* Gravity */

            p.vy += 0.035;


            /* Friction */

            p.vx *= 0.992;
            p.vy *= 0.992;


            /* Fade */

            p.life -= 0.012;


            if (
                p.life <= 0
            ) {

                particles.splice(
                    i,
                    1
                );

                continue;

            }


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `hsla(
                    ${p.hue},
                    100%,
                    65%,
                    ${p.life}
                )`;


            ctx.fill();

        }


        requestAnimationFrame(draw);

    }


    /* =====================================================
       WINDOW RESIZE EVENT
       ===================================================== */

    window.addEventListener(
        "resize",
        resize,
        {
            passive: true
        }
    );


    /* =====================================================
       START
       ===================================================== */

    resize();

    requestAnimationFrame(draw);


})();

</script>
